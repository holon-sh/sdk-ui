name: CI
on:
  pull_request:
  workflow_dispatch:
  # publish-dev.yml runs this first on every merge to main.
  workflow_call:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm pack
      - uses: actions/checkout@v4
        with:
          repository: holon-sh/cli
          ref: b46bc5980faf8d9a6b4ab19243371466a31daf75
          path: .cli
      - uses: actions/setup-go@v7
        with:
          go-version-file: .cli/go.mod
          cache-dependency-path: .cli/go.sum
      - name: Verify generated clients against the packed SDK
        run: .cli/scripts/test-sdk-consumers browser holon-ui-*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: holon-ui-*.tgz
