# Every merge to main publishes a dev build, 0.0.1-dev.<run number>, under npm's latest tag, so a
# plain `npm install holon-ui` gets the newest one. npm trusts this workflow by name to publish.
name: Publish dev release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: 0.0.1-dev.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update npm for trusted publishing
        run: npm install -g npm@11
      - run: npm ci
      - name: Set the dev version (not committed)
        run: npm version "$VERSION" --no-git-tag-version
      - run: npm publish --tag latest --access public --provenance
